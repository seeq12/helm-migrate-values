name: Release

# Releases are cut by hand: a maintainer bumps the version, tags locally and
# pushes the tag. Nothing here runs on its own. CI only builds the artifacts,
# so published binaries use the pinned toolchain rather than whatever happens
# to be on the maintainer's machine. See "Releasing" in README.md.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install YQ
        uses: dcarbone/install-yq-action@v1.1.1

      - name: Verify plugin.yaml matches the tag
        run: |
          pluginVersion=$(yq -r .version plugin.yaml)
          if [[ "$GITHUB_REF_NAME" != "$pluginVersion" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match plugin.yaml version '$pluginVersion'."
            echo "'helm plugin list' would report the wrong version for this release."
            echo "Fix plugin.yaml and cut the next version -- tags are immutable."
            exit 1
          fi
          echo "plugin.yaml version '$pluginVersion' matches tag '$GITHUB_REF_NAME'"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
