version: 2

before:
  hooks:
    - go mod tidy

project_name: helm-migrate-values
builds:
  - id: default
    main: ./cmd/helm-migrate-values
    binary: bin/migrate-values
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.FullCommit}}
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - name_template: '{{ .ProjectName }}-{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}-{{ .Arch }}'
    formats: ['tgz']
    wrap_in_directory: migrate-values
    files:
      - README.md
      - plugin.yaml
      - LICENSE
      - NOTICE
      - install-binary.sh
    format_overrides:
      - goos: windows
        formats: ['zip']

# Release notes are written on the GitHub release itself, not generated from
# commit messages.
changelog:
  disable: true

release:
  prerelease: auto
  # Releases are created from the GitHub Releases UI, so the notes written there
  # are the release notes. keep-existing (also the default) stops this build
  # replacing them -- it only uploads the archives and checksums.
  mode: keep-existing
